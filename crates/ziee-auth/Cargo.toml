[package]
name = "ziee-auth"
version = "0.0.0"
edition.workspace = true

[dependencies]
ziee-framework = { path = "../ziee-framework" }
ziee-identity = { path = "../ziee-identity" }

# Versions match the ziee server crate's [workspace.dependencies] catalog
# (src-app/Cargo.toml) so the single src-app/Cargo.lock unifies them without a
# duplicate build when ziee consumes ziee-auth by path. ziee-auth owns the
# concrete auth/user wire types (User/Group/...) which derive serde/schemars +
# sqlx::FromRow and implement the pluggable identity traits.
serde = { version = "1.0.219", features = ["derive"] }
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
# `User` implements axum_login's `AuthUser` for the tower-sessions session store.
axum-login = "0.18.0"
