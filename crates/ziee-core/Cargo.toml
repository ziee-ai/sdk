[package]
name = "ziee-core"
version = "0.0.0"
edition.workspace = true

[dependencies]
# Versions match the ziee server crate's [workspace.dependencies] catalog
# (src-app/Cargo.toml) so the single src-app/Cargo.lock unifies them without a
# duplicate build when ziee consumes ziee-core by path.
axum = { version = "0.8.4" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
uuid = { version = "1.18", features = ["serde", "v4"] }
# sqlx is a TYPES-only dependency here (the `From<sqlx::Error>` conversion). No
# `query!` macros are used in ziee-core, so it stays build-DB-free (plan §7).
sqlx = { version = "0.8.6", default-features = false }
tracing = "0.1"
once_cell = "1.21.3"
dirs = "6.0.0"

[dev-dependencies]
# YAML parser used by the config sub-type tests (matches ziee's `serde_norway`).
serde_norway = "0.9"
