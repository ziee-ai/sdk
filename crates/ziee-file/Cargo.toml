[package]
name = "ziee-file"
version = "0.0.0"
edition = "2024"

[features]
# `routes` (default-on) turns on the mountable file HTTP/aide surface
# (`http::file_routes` — the store-generic management/download/versions handlers)
# and its aide/axum/ziee-framework/ziee-auth + jsonwebtoken deps. The file STORE
# ENGINE (models, storage, repository, types, utils, permissions, seams, ingest)
# compiles with `default-features = false` — no aide/axum — so an engine-only
# consumer stays lean. The routes surface has NO `query!` macros beyond those the
# engine already carries, so this feature does not change the file-only build-DB
# story.
default = ["routes"]
routes = ["dep:aide", "dep:axum", "dep:ziee-framework", "dep:ziee-auth", "dep:jsonwebtoken"]

[dependencies]
# `ziee-file` is the generic, domain-agnostic multi-derivative blob STORE:
# the `File`/`FileVersion` wire+insert models (+ the pure-data
# `ProcessingResult`/`ProcessingMetadata`), the `FileStorage` trait +
# `FilesystemStorage` impl + global manager, the schema-bound `FileRepository`
# (`query!` macros over `files`/`file_versions` — this crate carries a build.rs
# provisioning a file-only build DB, mirroring ziee-auth), the download-token /
# pagination DTOs, the `extension_of` blob-key + magic-sniff + zip-bomb upload
# validators, the `files::*` permission keys (`ziee_identity::PermissionCheck`),
# and the two injected seams (`FileProcessor` / `FileEvents`) that sever the
# app's processing engine + sync/RAG from the store. It CARRIES the base
# `files`/`file_versions` migration (`migrations/`, globbed into the app's
# merged set). NO domain reference (no workflow_run_id column, no chat/llm/
# project imports).
ziee-core = { path = "../ziee-core" }
ziee-identity = { path = "../ziee-identity" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
tokio = { version = "1.47.1", features = ["fs", "time"] }
async-trait = "0.1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2.0"
zip = "6.0.0"

# HTTP/aide surface (routes feature only). `ziee-framework` provides the
# resolver-generic permission extractors (`RequirePermissions<R,_>` +
# `with_permission`) + the `SyncOrigin` header extractor; `ziee-auth` provides
# the concrete `User`/`Group` wire types the routes fix their resolver to (every
# file response is owner-scoped by `user.id`). Versions match ziee-framework so
# the single aide/axum version unifies. `jsonwebtoken` signs download tokens.
ziee-framework = { path = "../ziee-framework", optional = true }
ziee-auth = { path = "../ziee-auth", optional = true }
# `axum-query` supplies `OperationInput` for `axum::extract::Query` (the file
# handlers' pagination/preview/page query params). The workspace-level aide the
# server links already enables it, so the full-build feature union is unchanged;
# it is declared here so `ziee-file` compiles STANDALONE (sdk `cargo check
# --workspace`).
aide = { version = "0.15", features = ["axum", "axum-json", "axum-query", "macros"], optional = true }
axum = { version = "0.8.4", features = ["macros", "multipart"], optional = true }
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"], optional = true }

[target.'cfg(unix)'.dependencies]
# `shard_flat_originals`'s mover opens its byte-compare targets with
# `O_NOFOLLOW` (+ `O_NONBLOCK`, so a planted FIFO can't hang the open) so the
# symlink-refusal and the open are one atomic syscall instead of a
# check-then-read `symlink_metadata` + `fs::read` pair. Already present
# transitively (tokio, sqlx); pinned directly here because this crate now
# references `libc::O_NOFOLLOW`/`libc::ELOOP` itself.
libc = "0.2"

[dev-dependencies]
# Crate-scoped integration tests (tests/repository.rs) drive the async
# `FileRepository` against a throwaway DB, so they need a `#[tokio::test]`
# runtime. sqlx/uuid/serde_json/ziee-core are already regular deps and thus
# available to the tests unchanged.
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
# The in-source `storage::filesystem` unit tests provision a scratch dir.
tempfile = "3.15"
# Round-3 regression test for the mover's dedup-compare conflict logging
# (`shard_flat_originals_counts_an_unreadable_flat_source_as_a_conflict_with_the_real_reason`)
# captures the `tracing::warn!` text to assert the log states the REAL reason
# instead of the old, misleading "both locations hold DIFFERENT bytes" claim.
# Version matches `sandbox-guest-agent`'s existing use elsewhere in this
# workspace, so the resolver reuses the already-locked version.
tracing-subscriber = "0.3"
# `tests/http_routes.rs` drives the mountable `file_routes` bundle in-process via
# `tower::oneshot` (mirrors ziee-health's crate-scoped HTTP test).
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
# File-only build DB provisioning (mirrors ziee-auth): create + migrate
# `ziee_file_build_<key>` on the shared :54321 cluster and point sqlx
# compile-time `query!` verification at it. The base `files`/`file_versions`
# tables carry no cross-module FK, so the file subset provisions standalone.
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate"] }
