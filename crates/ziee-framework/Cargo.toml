[package]
name = "ziee-framework"
version = "0.0.0"
edition.workspace = true

[dependencies]
ziee-core = { path = "../ziee-core" }
ziee-identity = { path = "../ziee-identity" }

# Versions match the ziee server crate's [workspace.dependencies] catalog
# (src-app/Cargo.toml) so the single src-app/Cargo.lock unifies them without a
# duplicate build when ziee consumes ziee-framework by path. These crates are
# TYPES + machinery only (module system + app_builder); build-DB-free (plan §7).
aide = { version = "0.15", features = ["axum", "axum-json", "macros"] }
axum = { version = "0.8.4", features = ["macros", "multipart"] }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tower_governor = "0.7"
linkme = "0.3"
async-trait = "0.1"
tracing = "0.1"
# Chunk B3: the permission-enforcement layer (RequirePermissions / with_permission)
# derives JsonSchema/serde on the 403 `PermissionError` body and constructs it as
# an OpenAPI example. Versions match ziee-identity + the ziee server catalog so
# the single src-app/Cargo.lock unifies them.
serde = { version = "1.0.219", features = ["derive"] }
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
# Chunk B5: the realtime-sync core (per-user SSE connection registry + caps +
# audience routing + self-echo). The registry holds `tokio::sync::mpsc` senders
# and keys connections by `uuid`. Versions match the ziee server catalog so the
# single src-app/Cargo.lock unifies them.
tokio = { version = "1.47.1", features = ["sync"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
# Chunk B6: the emit_ts generator deserializes the OpenAPI spec into an
# insertion-order-preserving value (indexmap, NOT serde_json::Value which would
# alphabetize) and the driver tail serializes the finished doc + reads the JSON
# back. Versions match the ziee server catalog so the single src-app/Cargo.lock
# unifies them.
indexmap = { version = "2", features = ["serde"] }
serde_json = "1.0.141"
