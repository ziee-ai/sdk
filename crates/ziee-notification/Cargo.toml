[package]
name = "ziee-notification"
version = "0.0.0"
edition = "2024"

[dependencies]
# `ziee-notification` owns the DB-free wire/insert types (`models`:
# `Notification`/`NewNotification`/`NotificationPage`/`UnreadCount`, schemars
# keys preserved; `Notification` derives `sqlx::FromRow` but issues no `query!`)
# + the `NotificationsRead` permission key (`ziee_identity::PermissionCheck`),
# and CARRIES THE MODULE'S MIGRATIONS (`migrations/`, globbed into the app's
# merged set). The schema-bound `repository` (compile-time `query_as!`) +
# `events` (concrete `SyncEntity::Notification`) + aide/axum handlers/routes +
# prune + registration stay in ziee: the queries verify only against the app's
# FULL merged build DB — this crate needs NO build DB.
#
# STANDALONE-APPLICABLE (gap N-1): this crate's `migrations/` is now
# DOMAIN-AGNOSTIC — the schema keeps `scheduled_task_id`/`workflow_run_id`/
# `conversation_id`/`user_id` as PLAIN nullable UUID columns with NO foreign
# keys, so `migrations/` applies alone on a fresh DB that has none of chat's
# `conversations`, scheduler's `scheduled_tasks`, workflow's `workflow_runs`,
# or ziee-auth's `users`. ziee (or any app that DOES have those domain tables)
# re-adds the FK constraints in a ziee-side module migration
# (`server/src/modules/notification/migrations/*_notification_fkeys.sql`),
# sorted after both `notifications` and the domain tables exist. Only
# `ziee-identity` is a declared dep, and it ships no migrations.
# Versions match the ziee server crate so the single src-app/Cargo.lock unifies
# them. Build-DB-free.
ziee-identity = { path = "../ziee-identity" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
