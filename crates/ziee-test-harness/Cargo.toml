[package]
name = "ziee-test-harness"
version = "0.0.0"
edition.workspace = true

# The SDK's integration-test harness support crate. The generic core of the
# former `server/tests/common/harness_inner.rs`: spawn the app binary against a
# per-test isolated DB cloned from a fully-migrated template, allocate a free
# port, render + write a temp config, health-poll readiness, and reap
# everything (process + temp config + DROP DATABASE + tempdirs) on Drop.
#
# App-neutral: the harness names ONLY the `HarnessApp` seam, never `ziee`. Each
# consuming app implements `HarnessApp` once (binary name, template DB base,
# migration dirs, config render, pre-spawn side effects) and reuses all the
# spawn/isolation/DB-clone/Drop machinery for free — the same reuse posture the
# other SDK crates hold.
#
# A LEAN dev/test-support crate: it opens only RUNTIME Postgres connections (no
# compile-time `query!` macros → build-DB-FREE), so it compiles with no build DB
# and stays cheap as a `[dev-dependencies]` entry. Deps' versions + feature sets
# mirror the ziee server catalog so the single `src-app/Cargo.lock` unifies them
# without a duplicate build. Re-exports `ziee_build_support::worktree_db` so
# consumers keep one import for the per-worktree DB keying it shares with build.rs.

[dependencies]
ziee-build-support = { path = "../ziee-build-support" }

# Runtime-only Postgres: no `macros` feature → no `query!` → build-DB-free.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate"] }
tokio = { version = "1.47.1", features = ["rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
uuid = { version = "1.18", features = ["v4"] }
url = "2.5"
tempfile = "3.15"
portpicker = "0.1"

# --- fixture features only (app-neutral auth/sync test mocks) ----------------
# Optional so the lean spawn/isolation core stays dep-light. Versions/features
# mirror the ziee server catalog so the single Cargo.lock unifies them.
serde_json = { version = "1", optional = true }        # both fixture groups
tokio-stream = { version = "0.1", optional = true }    # sync-probe only
testcontainers = { version = "0.27.3", optional = true }              # auth-mocks
wiremock = { version = "0.6", optional = true }                       # auth-mocks
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"], optional = true } # auth-mocks
base64 = { version = "0.22", optional = true }                        # auth-mocks
rsa = { version = "0.9", features = ["pem"], optional = true }        # auth-mocks

[features]
# The SSE sync probe ALONE. Split out of `fixtures` because the probe is the
# cheap half and the flag was the expensive half: an app that wants an SSE reader
# — the one tool that makes a two-user AUDIENCE bug observable, since
# `connection_id()` is what lets a test assert the acting connection was SKIPPED —
# had to accept `testcontainers` (a docker client) and `wiremock` (an HTTP mock
# server) into its `Cargo.lock` to get it. Cost is not neutral for a diagnostic:
# whatever raises the price of the tool raises the odds the next audience bug
# ships unseen. These three are exactly what `sync_probe.rs` names.
sync-probe = ["dep:serde_json", "dep:tokio-stream", "reqwest/stream"]

# The OAuth/LDAP/Apple mocks. `tokio/macros` is theirs alone (their `#[tokio::test]`
# self-tests); `sync_probe` has none, which is why it does not pull it.
auth-mocks = [
    "dep:serde_json",
    "dep:testcontainers",
    "dep:wiremock",
    "dep:jsonwebtoken",
    "dep:base64",
    "dep:rsa",
    "tokio/macros",
]

# Everything — the pre-split meaning of this flag, preserved exactly so no
# existing consumer changes behaviour.
fixtures = ["sync-probe", "auth-mocks"]
