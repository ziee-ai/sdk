[package]
name = "ziee-desktop-harness"
version = "0.0.0"
edition.workspace = true

# `ziee-desktop-harness` — the REUSABLE desktop shell for an SDK app.
#
# It depends ONLY on the SDK crates (never on `ziee`/the app), so a second app
# (CytoAnalyst) gets the desktop experience for free. What lives here today:
#   - the FOUR-part capability manifest keyed by deployment mode (`manifest`),
#   - the single-user auto-login strategy + owner-`*` model (`single_user`),
#   - the `ServerBoot` seam (`boot`) the app implements to hand the harness a
#     booted server's {addr, pool, jwt}.
#
# Chunk D-full: the reusable window shell (`window` module) now lives here —
# the per-OS main-window construction + the boot→window spawn skeleton, generic
# over the `ServerBoot` seam. `tauri` is therefore a dependency now (it was
# deferred through Chunk D so the earlier `cargo check --workspace` stayed
# fast). It still names ONLY the `ServerBoot` seam, never `ziee::`.

[dependencies]
# SDK crates only — NEVER the `ziee` app crate (reusability contract).
ziee-core = { path = "../../crates/ziee-core" }
ziee-identity = { path = "../../crates/ziee-identity" }
ziee-auth = { path = "../../crates/ziee-auth" }

# Tauri — for the window shell (`window::create_main_window` +
# `spawn_boot_then_window`). Version matches `ziee-desktop` so the single
# `src-app/Cargo.lock` unifies onto one tauri build when ziee-desktop consumes
# the harness by path. `tauri-plugin-decorum` is the Windows overlay-titlebar
# used by `create_main_window` (windows-gated).
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-decorum = "1.1.1"

# Versions match the ziee server crate + ziee-auth so the single
# src-app/Cargo.lock unifies them (no duplicate build when ziee consumes the
# harness by path).
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
uuid = { version = "1.18", features = ["v4"] }
tracing = "0.1"

# Linux/WebKitGTK: enable programmatic window.open for the portal pop-out (with_webview setting).
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
